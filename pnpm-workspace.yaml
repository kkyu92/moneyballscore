packages:
  - "apps/*"
  - "packages/*"
  - "cloudflare-worker"

# pnpm 11 마이그레이션 — 이전 root package.json "pnpm" 필드 이관 (cycle 2757 사용자 결정)
# pnpm 11 부터 package.json "pnpm" 필드 무시 (WARN 로그) → workspace 로 이동
overrides:
  fast-uri: ">=3.1.2"
  postcss: ">=8.5.10"
  "minimatch@3>brace-expansion": "^1.1.14"
  "brace-expansion@<1.1.12": ">=1.1.14"
  "brace-expansion@2": ">=2.0.2"
  "brace-expansion@3": ">=3.0.2"
  "brace-expansion@4": ">=4.0.1"
  "brace-expansion@5": ">=5.0.6"
  ws: ">=8.20.1"
  turbo: ">=2.9.14"
  esbuild: ">=0.28.1"

auditConfig:
  ignoreCves:
    - GHSA-96hv-2xvq-fx4p
    - GHSA-vmh5-mc38-953g
    - GHSA-fx2h-pf6j-xcff

# pnpm 11 신규 supply-chain policy — minimum release age 0 (기존 lockfile 유지)
# 기본 = 24h. 우리 lockfile 은 CI-safe 이지만 신규 릴리즈 (electron-to-chromium 등)
# 자동 반영 시 minimum age 걸림 → 0 으로 정책 완화
minimumReleaseAge: 0

# pnpm 11 신규 allowBuilds policy — install script 화이트리스트
# 이전 = onlyBuiltDependencies (deprecated). true = 빌드 스크립트 실행 허가
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
