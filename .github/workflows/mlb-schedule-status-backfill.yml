name: mlb-schedule-status-backfill

# Cloudflare Worker cron ('17 18-21,10 * * *')이 mlb_statsapi_scrape 의 primary
# trigger 이지만, CLOUDFLARE_API_TOKEN GH secret 미등록(TODOS.md cycle 2068/2090)으로
# deploy-cloudflare-worker.yml 가 계속 skip/fail — 즉 worker.ts 의 3일 재스크랩
# backfill 로직(643dba4e, 사례 23/24 fix)이 실제 production 에 한 번도 반영 안 된 상태.
# 결과: mlb_schedule.status 가 경기 종료 후에도 'scheduled' 로 영구 고정되는 회귀가
# 재발(cycle 2212 fix-incident 실측 — 2026-08-13~08-19 7일치 status 고정 확인,
# statsapi 는 정상적으로 Final 반환 중이었음 — /api/mlb/pipeline 직접 호출로 즉시 해소).
#
# CLOUDFLARE_API_TOKEN 등록(사용자 액션)과 무관하게 동작하는 독립 안전망 — 기존
# CRON_SECRET 만으로 Vercel API 를 직접 호출해 최근 3일(D, D-1, D-2)을 매일 재스크랩.
# worker.ts recentKstDates()와 동일 창(3일) 재사용. Cloudflare Worker 가 언젠가
# 재배포되어도 중복 upsert 라 안전(idempotent) — 제거 불필요.

on:
  schedule:
    # UTC 11:47 = KST 20:47 — Cloudflare Worker scrape(KST 03-06)와 겹치지 않는
    # 시간대에 하루 한 번, 그날 경기 대부분이 끝난 뒤 재확인.
    - cron: '47 11 * * *'
  workflow_dispatch:

concurrency:
  group: mlb-schedule-status-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-scrape last 3 KST dates
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          MLB_PIPELINE_URL="https://moneyballscore.vercel.app/api/mlb/pipeline"
          NOW_KST_EPOCH=$(( $(date -u +%s) + 9*3600 ))

          for OFFSET in 0 1 2; do
            TARGET_EPOCH=$(( NOW_KST_EPOCH - OFFSET*86400 ))
            DATE=$(date -u -d "@${TARGET_EPOCH}" +%Y-%m-%d)
            echo "=== re-scraping $DATE ==="
            RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" --max-time 60 \
              -X POST "$MLB_PIPELINE_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -d "{\"mode\":\"mlb_statsapi_scrape\",\"date\":\"${DATE}\",\"triggeredBy\":\"gh-backfill\"}" \
              || echo "HTTP_STATUS:000")
            STATUS=$(echo "$RESPONSE" | tail -n1 | sed 's/HTTP_STATUS://')
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "status=$STATUS body=$BODY"
            if [ "$STATUS" != "200" ]; then
              echo "::error::mlb_statsapi_scrape date=${DATE} failed (HTTP $STATUS): $BODY"
              exit 1
            fi
          done

      - name: Notify playbook on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PLAYBOOK_PAT }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          TITLE="${WORKFLOW_NAME} 실패"
          BODY="Workflow: ${WORKFLOW_NAME}
          Run: ${RUN_URL}
          Branch: ${BRANCH}
          Commit: ${COMMIT_SHA}"
          gh api repos/kkyu92/playbook/dispatches \
            -f event_type=worker-error \
            -f "client_payload[source_repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[title]=${TITLE}" \
            -f "client_payload[body]=${BODY}" \
            -f "client_payload[type]=error-log" \
            -f "client_payload[severity]=error" \
            -f "client_payload[fingerprint]=mlb-schedule-status-backfill-failure" \
            -f "client_payload[environment]=production" \
            -f "client_payload[run_url]=${RUN_URL}"
