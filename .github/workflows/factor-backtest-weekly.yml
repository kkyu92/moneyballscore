name: factor-backtest-weekly

# 주간 factor backtest 자동 fire — packages/kbo-data/src/pipeline/backtest-manual-weights-run.ts.
# 결과 JSON 박제 + 변화 시 Sentry warning (plan #8 Tier 1 M2).
#
# cron '33 17 * * 0' (UTC 일 17:33 = KST 월 02:33) — verify cron 직후 baseline 측정 timing.
# manual fire 가능 (workflow_dispatch).

on:
  schedule:
    - cron: '33 17 * * 0'
  workflow_dispatch:

concurrency:
  group: factor-backtest-weekly
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run manual weights backtest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -eo pipefail
          mkdir -p apps/moneyball/data/backtest-results
          DATE=$(date -u +%Y-%m-%d)
          OUT="apps/moneyball/data/backtest-results/${DATE}-manual-weights.txt"
          # GH runner ↔ Supabase DNS 일시 실패(fetch failed/ENOTFOUND) 대응 — data-refresh-weekly 와 동일 원인 재발 확인(cycle 3329)
          for attempt in 1 2 3; do
            if pnpm exec tsx packages/kbo-data/src/pipeline/backtest-manual-weights-run.ts 2>&1 | tee "$OUT"; then
              [ -s "$OUT" ] && ! grep -qE "fetch failed|ENOTFOUND" "$OUT" && break
            fi
            echo "::warning::backtest attempt $attempt failed, retrying..."
            sleep 15
          done
          if [ ! -s "$OUT" ]; then
            echo "::error::backtest output empty after 3 attempts"
            exit 1
          fi
          if grep -qE "Command \"tsx\" not found|ERR_PNPM" "$OUT"; then
            echo "::error::tsx invocation failed (silent drift family)"
            exit 1
          fi
          if grep -qE "fetch failed|ENOTFOUND" "$OUT"; then
            echo "::error::backtest failed after 3 attempts (DNS flake persisted)"
            exit 1
          fi
          echo "::notice::backtest result saved to $OUT"

      - name: Create PR (data prefix, R7 auto-merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="data/factor-backtest-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add apps/moneyball/data/backtest-results/
          if [ -f apps/moneyball/data/v2-backtest-results.json ]; then
            git add apps/moneyball/data/v2-backtest-results.json
          fi
          git commit -m "data(backtest): ${DATE} factor backtest weekly (plan #8 Tier 1 M2)" || {
            echo "::notice::no changes to commit"
            exit 0
          }
          git push -u origin "$BRANCH"

          # gh pr create/merge transient API 503 대응 — op-analysis-weekly 와 동일 패턴
          # (cycle 2156 incident: PR create 실패로 branch stranded, 다음 cron 1주일 후까지 방치됨)
          PR_URL=""
          for attempt in 1 2 3 4 5; do
            if PR_URL=$(gh pr create \
              --title "data(backtest): ${DATE} factor backtest weekly (cron)" \
              --body "plan #8 Tier 1 M2 — weekly cron 자동 backtest. cycle 231 v2.0 후보 적용 시 추정 acc/Brier 박제." \
              --label "automated,backtest" 2>&1); then
              break
            fi
            echo "::warning::gh pr create attempt ${attempt} failed: ${PR_URL}"
            PR_URL=""
            sleep $((attempt * 10))
          done

          if [ -z "$PR_URL" ]; then
            echo "::error::gh pr create failed after retries — branch $BRANCH pushed but no PR. Recover manually: gh pr create --head $BRANCH"
            exit 1
          fi

          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')

          if ! gh pr checks "$PR_NUM" --watch --fail-fast; then
            echo "::warning::CI failed for PR $PR_NUM — skip merge, needs manual review"
            exit 0
          fi

          MERGED=false
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_NUM" --squash --delete-branch; then
              MERGED=true
              break
            fi
            echo "::warning::gh pr merge attempt ${attempt} failed"
            sleep $((attempt * 10))
          done

          if [ "$MERGED" != "true" ]; then
            echo "::error::gh pr merge failed after retries — PR #$PR_NUM created, CI green, but merge failed. Recover manually: gh pr merge $PR_NUM --squash --delete-branch"
            exit 1
          fi

          echo "::notice::PR $PR_URL merged after CI green"
