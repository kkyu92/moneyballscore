name: deploy-drift-alert

# Production deploy drift 자동 감지 — 드리프트 사례 9 (cycle 772 .vercelignore
# 임시 해소) + 사례 10 (cycle 794 Turbopack build fail) silent drift family
# alert coverage 확장 (cycle 838).
#
# main HEAD 와 production alias 의 VERCEL_GIT_COMMIT_SHA 시간당 비교:
# - mismatch + ≥ 1 hour gap (사용자 가시 잠재 silent drop) → ::error::
# - production /api/version endpoint 부재 (deploy fail / endpoint X) → ::error::
# - 정상 sync → ::notice:: + exit 0
#
# silent drift family alert 박제 (Sentry warning + GH Actions email 알림 자동
# fire). 사례 8 (cycle 826 KBO scraper) / 사례 11 (cycle 819 predict_final)
# 패턴 정합.
#
# cron schedule = '17 * * * *' (매시간 UTC 17분)
# - sitemap-warmup '37 * * * *' / indexnow-ping '37 0 * * *' 분 겹침 회피
# - 매시간 검사로 30+ commit silent skip 누적 (사례 10) 즉시 감지
#
# cycle 907 (plan #11 Step 1) — /api/version response_time_ms threshold 측정 추가:
# - body.response_time_ms > 2000 시 ::warning:: 별도 출력 (slow degradation
#   silent skip 차단 — alert fatigue 회피 위해 error 아님 warning 분기)
#
# cycle 2222 (fix-incident) — fetch-depth 1→0 fix:
# - 실측: 2026-08-15~08-18 26시간 연속 ::error:: (deploy-drift-alert 매시간
#   fail). 근본원인 = develop-cycle 봇 push burst(115 commit) 뒤 Vercel 직렬
#   빌드 큐가 서서히 caught up (자연 해소, 실제 deploy 고장 아님).
# - 진짜 버그: fetch-depth=1 shallow clone 이라 PROD_SHA 커밋 오브젝트가
#   로컬에 없어서 `git rev-list --count PROD_SHA..MAIN_SHA` 항상 실패 →
#   COMMITS_AHEAD 항상 "unknown" 으로 로그 — 심각도 판단(대량 backlog
#   catch-up 중 vs 소수 commit 인데 정말 멈춤) 불가능했던 진단 정보 손실.
# - fix: fetch-depth 0 (전체 history, repo 68MB/4639 commit 규모라 3분
#   timeout 안 충분) 로 COMMITS_AHEAD 항상 정확히 계산되도록 수정.
#
# cycle 2898 (fix-incident) — 연속-실행 progress 비교 추가:
# - 실측: 2026-08-31~09-04 4일간 20회 중 12회(60%) ::error::. 두 사례 모두
#   commits_ahead 값이 여러 시간(최대 15h) 동안 완전히 고정 — 진짜 backlog
#   drain 중이면 시간이 지날수록 prod_sha 가 조금씩 전진해야 하는데, 그 사이
#   main 도 안 움직였고 prod 도 안 움직인 경우가 섞여 있어 "queue 가 서서히
#   caught up" (cycle 2222 결론) 만으론 설명 안 됨 — 일부는 실제 정체.
# - 문제: 매 실행이 독립적(state 없음) 이라 "이번 시간 동안 진전이 있었는지"
#   판별 불가 — gap_hours 단일 값만 보고 벌크 backlog drain 중(정상)과 진짜
#   멈춤(비정상)을 구분 못해 매시간 동일 강도 ::error:: 반복 = alert fatigue.
# - fix: actions/cache 로 직전 실행의 prod_sha 를 저장해 이번 실행과 비교.
#   prod_sha 가 직전 실행과 동일(지난 1시간 진전 0) + gap_hours >= 3 일 때만
#   ::error:: (진짜 정체 의심). prod_sha 가 전진 중이면 gap_hours 커도
#   ::notice:: (drain 진행 중, 정상). gap_hours < 3 은 기존대로 유지.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-drift-alert
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Restore previous drift state
        id: restore-state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .drift-state
          key: drift-state-${{ github.run_id }}
          restore-keys: |
            drift-state-

      - name: Compare main HEAD vs production /api/version
        run: |
          set -e
          MAIN_SHA=$(git rev-parse HEAD)
          MAIN_SHORT=$(git rev-parse --short HEAD)
          echo "main_sha=$MAIN_SHA"
          echo "main_short=$MAIN_SHORT"

          PROD_URL="https://moneyballscore.vercel.app/api/version"
          echo "Fetching $PROD_URL"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -A "moneyball-drift-alert/1.0" \
            --max-time 30 \
            "$PROD_URL" || echo "HTTP_STATUS:000")
          STATUS=$(echo "$RESPONSE" | tail -n1 | sed 's/HTTP_STATUS://')
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "status=$STATUS"
          echo "body=$BODY"

          if [ "$STATUS" != "200" ]; then
            echo "::error::production /api/version 응답 비정상 (HTTP $STATUS) — endpoint 부재 또는 deploy fail. 사례 10 (Turbopack build fail) family 재발 의심."
            exit 1
          fi

          PROD_SHA=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('commit_sha') or '')" 2>/dev/null || echo "")
          echo "prod_sha=$PROD_SHA"

          RESPONSE_MS=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); v=d.get('response_time_ms'); print(v if isinstance(v,int) else '')" 2>/dev/null || echo "")
          THRESHOLD_MS=2000
          if [ -n "$RESPONSE_MS" ] && [ "$RESPONSE_MS" -gt "$THRESHOLD_MS" ]; then
            echo "::warning::production /api/version response_time_ms=${RESPONSE_MS} > threshold ${THRESHOLD_MS}ms — slow degradation 감지 (alert fatigue 차단 위해 warning 분기, error X). cold start / 서버리스 한도 / supabase connection 지연 점검 권장."
          fi
          echo "response_time_ms=$RESPONSE_MS"

          if [ -z "$PROD_SHA" ]; then
            echo "::error::production VERCEL_GIT_COMMIT_SHA 비어있음 (empty string, not just missing) — git 미연동 CLI/manual deploy 로 production 이 교체됐을 가능성 (사례 9/10 family, cycle 2204 실측: dpl 인스펙트 결과 git-main alias 부재 확인). main HEAD 대비 실제 drift 여부 확인 불가 = silent pass 시 사례 9/10 재발 은폐 위험. vercel ls --prod + vercel inspect <id> 로 해당 배포가 git-linked 인지 즉시 확인 권장."
            exit 1
          fi

          if [ "$MAIN_SHA" = "$PROD_SHA" ]; then
            echo "::notice::main HEAD = production alias ($MAIN_SHORT). drift 0."
            exit 0
          fi

          COMMITS_AHEAD=$(git rev-list --count "$PROD_SHA..$MAIN_SHA" 2>/dev/null || echo "unknown")
          MAIN_TIME=$(git log -1 --format=%ct "$MAIN_SHA" 2>/dev/null || echo "0")
          NOW=$(date +%s)
          GAP_SECONDS=$((NOW - MAIN_TIME))
          GAP_HOURS=$((GAP_SECONDS / 3600))

          echo "main_short=$MAIN_SHORT prod_short=$(echo $PROD_SHA | cut -c1-7)"
          echo "commits_ahead=$COMMITS_AHEAD gap_hours=$GAP_HOURS"

          PREV_PROD_SHA=$(cat .drift-state 2>/dev/null || echo "")
          echo "prev_prod_sha=$PREV_PROD_SHA"
          echo "$PROD_SHA" > .drift-state

          if [ "$GAP_HOURS" -lt 1 ]; then
            echo "::notice::recent push detected — main HEAD ($MAIN_SHORT) vs production ($(echo $PROD_SHA | cut -c1-7)) mismatch이지만 gap ${GAP_HOURS}h < 1h (deploy in progress). 다음 시간 재검사."
          elif [ -n "$PREV_PROD_SHA" ] && [ "$PREV_PROD_SHA" = "$PROD_SHA" ] && [ "$GAP_HOURS" -ge 3 ]; then
            echo "::error::deploy drift detected — main HEAD ($MAIN_SHORT) vs production ($(echo $PROD_SHA | cut -c1-7)) mismatch. $COMMITS_AHEAD commit ahead, gap ${GAP_HOURS}h, prod_sha 직전 실행과 동일(지난 1시간 진전 0) — 정체 의심. 사례 9/10 silent drift family 재발 의심 — vercel ls --prod + vercel inspect <id> --logs 진단 권장."
            exit 1
          else
            echo "::notice::deploy drift 진행 중 — main HEAD ($MAIN_SHORT) vs production ($(echo $PROD_SHA | cut -c1-7)) mismatch, $COMMITS_AHEAD commit ahead, gap ${GAP_HOURS}h. prod_sha 가 직전 실행과 다르거나(진전 중) gap < 3h — backlog drain 정상 진행으로 판단, 다음 시간 재검사."
          fi

      - name: Save drift state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .drift-state
          key: drift-state-${{ github.run_id }}
